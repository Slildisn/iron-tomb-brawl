<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="母鸡大战公鸡 · 小鸡塔防">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="52%" stop-color="#ffeed2"/>
      <stop offset="100%" stop-color="#d8f3e3"/>
    </linearGradient>
    <radialGradient id="glowA" cx="14%" cy="6%" r="52%">
      <stop offset="0%" stop-color="#ffdb8a" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#ffdb8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="10%" r="46%">
      <stop offset="0%" stop-color="#8fd6b4" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#8fd6b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="henFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#f5bc3c"/>
    </linearGradient>
    <linearGradient id="sniperFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe8cc"/>
      <stop offset="100%" stop-color="#ffc489"/>
    </linearGradient>
    <linearGradient id="rockFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7dee2"/>
    </linearGradient>
    <linearGradient id="roosterFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8f70"/>
      <stop offset="100%" stop-color="#ff5f45"/>
    </linearGradient>
    <linearGradient id="lawnPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9f0da"/>
      <stop offset="100%" stop-color="#a6e2c4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- 背景装饰蛋 -->
  <g opacity=".28">
    <ellipse cx="96" cy="140" rx="34" ry="44" fill="#fff3d6"/>
    <ellipse cx="1116" cy="120" rx="28" ry="36" fill="#ffffff" opacity=".8"/>
    <ellipse cx="132" cy="520" rx="24" ry="31" fill="#c9f0da"/>
    <ellipse cx="1084" cy="512" rx="30" ry="39" fill="#ffe9b8"/>
  </g>

  <!-- 标题 -->
  <text x="600" y="150" text-anchor="middle"
        font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif"
        font-size="86" font-weight="800" fill="#5c4326" letter-spacing="2">母鸡大战公鸡</text>
  <text x="600" y="206" text-anchor="middle"
        font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif"
        font-size="27" fill="#8a7256" letter-spacing="1.5">5×9 草坪塔防 · 玉米粒经营 · 三分钟一局</text>

  <!-- 草坪 -->
  <rect x="330" y="286" width="540" height="288" rx="26" fill="url(#lawnPanel)"/>
  <g>
    <rect x="348" y="302" width="52" height="52" rx="12" fill="#6fc7a0"/>
    <rect x="406" y="302" width="52" height="52" rx="12" fill="#63bb94"/>
    <rect x="464" y="302" width="52" height="52" rx="12" fill="#6fc7a0"/>
    <rect x="522" y="302" width="52" height="52" rx="12" fill="#63bb94"/>
    <rect x="580" y="302" width="52" height="52" rx="12" fill="#6fc7a0"/>
    <rect x="638" y="302" width="52" height="52" rx="12" fill="#63bb94"/>
    <rect x="696" y="302" width="52" height="52" rx="12" fill="#6fc7a0"/>
    <rect x="754" y="302" width="52" height="52" rx="12" fill="#63bb94"/>
    <rect x="812" y="302" width="52" height="52" rx="12" fill="#6fc7a0"/>

    <rect x="348" y="360" width="52" height="52" rx="12" fill="#63bb94"/>
    <rect x="406" y="360" width="52" height="52" rx="12" fill="#6fc7a0"/>
    <rect x="464" y="360" width="52" height="52" rx="12" fill="#63bb94"/>
    <rect x="522" y="360" width="52" height="52" rx="12" fill="#6fc7a0"/>
    <rect x="580" y="360" width="52" height="52" rx="12" fill="#63bb94"/>
    <rect x="638" y="360" width="52" height="52" rx="12" fill="#6fc7a0"/>
    <rect x="696" y="360" width="52" height="52" rx="12" fill="#63bb94"/>
    <rect x="754" y="360" width="52" height="52" rx="12" fill="#6fc7a0"/>
    <rect x="812" y="360" width="52" height="52" rx="12" fill="#63bb94"/>

    <rect x="348" y="418" width="52" height="52" rx="12" fill="#6fc7a0"/>
    <rect x="406" y="418" width="52" height="52" rx="12" fill="#63bb94"/>
    <rect x="464" y="418" width="52" height="52" rx="12" fill="#6fc7a0"/>
    <rect x="522" y="418" width="52" height="52" rx="12" fill="#63bb94"/>
    <rect x="580" y="418" width="52" height="52" rx="12" fill="#6fc7a0"/>
    <rect x="638" y="418" width="52" height="52" rx="12" fill="#63bb94"/>
    <rect x="696" y="418" width="52" height="52" rx="12" fill="#6fc7a0"/>
    <rect x="754" y="418" width="52" height="52" rx="12" fill="#63bb94"/>
    <rect x="812" y="418" width="52" height="52" rx="12" fill="#6fc7a0"/>

    <rect x="348" y="476" width="52" height="52" rx="12" fill="#63bb94"/>
    <rect x="406" y="476" width="52" height="52" rx="12" fill="#6fc7a0"/>
    <rect x="464" y="476" width="52" height="52" rx="12" fill="#63bb94"/>
    <rect x="522" y="476" width="52" height="52" rx="12" fill="#6fc7a0"/>
    <rect x="580" y="476" width="52" height="52" rx="12" fill="#63bb94"/>
    <rect x="638" y="476" width="52" height="52" rx="12" fill="#6fc7a0"/>
    <rect x="696" y="476" width="52" height="52" rx="12" fill="#63bb94"/>
    <rect x="754" y="476" width="52" height="52" rx="12" fill="#6fc7a0"/>
    <rect x="812" y="476" width="52" height="52" rx="12" fill="#63bb94"/>
  </g>

  <!-- 单位：母鸡 -->
  <g>
    <ellipse cx="374" cy="396" rx="22" ry="7" fill="#2f7c69" opacity=".18"/>
    <rect x="354" y="336" width="40" height="54" rx="16" fill="url(#henFill)" stroke="#e0a12f" stroke-width="2"/>
    <rect x="350" y="326" width="20" height="12" rx="6" fill="#e8452c"/>
    <circle cx="366" cy="352" r="4" fill="#4a2c18"/>
    <path d="M394 356 l12 5 -12 5z" fill="#ff8c42"/>
  </g>

  <!-- 单位：小鸡狙击手 -->
  <g>
    <ellipse cx="494" cy="452" rx="20" ry="6" fill="#2f7c69" opacity=".18"/>
    <circle cx="490" cy="420" r="19" fill="url(#sniperFill)" stroke="#e8a86a" stroke-width="2"/>
    <rect x="472" y="398" width="36" height="11" rx="5" fill="#ff9f43"/>
    <circle cx="483" cy="424" r="3.6" fill="#4a2c18"/>
    <rect x="506" y="416" width="18" height="8" rx="4" fill="#9c7a63"/>
  </g>

  <!-- 单位：石头蛋 -->
  <g>
    <ellipse cx="614" cy="392" rx="23" ry="7" fill="#2f7c69" opacity=".18"/>
    <rect x="592" y="332" width="44" height="56" rx="14" fill="url(#rockFill)" stroke="#c3ccd4" stroke-width="2"/>
    <rect x="600" y="340" width="16" height="12" rx="4" fill="#ffffff" opacity=".9"/>
  </g>

  <!-- 敌人：公鸡 -->
  <g>
    <ellipse cx="808" cy="392" rx="20" ry="7" fill="#7a2f1c" opacity=".16"/>
    <path d="M824 336 l16 -12 2 20z" fill="#d93b2b"/>
    <rect x="786" y="330" width="38" height="60" rx="14" fill="url(#roosterFill)" stroke="#d0442b" stroke-width="2"/>
    <rect x="792" y="320" width="22" height="12" rx="6" fill="#e53935"/>
    <circle cx="798" cy="346" r="4" fill="#fff6e0"/>
    <circle cx="798" cy="346" r="2" fill="#3e2723"/>
    <path d="M786 356 l-13 5 13 6z" fill="#ffc107"/>
    <circle cx="792" cy="372" r="4.5" fill="#e53935"/>
  </g>

  <!-- 玉米粒 -->
  <circle cx="672" cy="326" r="11" fill="#ffd54a" stroke="#e0a800" stroke-width="2.5"/>
  <circle cx="760" cy="500" r="11" fill="#ffd54a" stroke="#e0a800" stroke-width="2.5"/>

  <!-- 底部标签 -->
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif" font-size="19" font-weight="600">
    <rect x="384" y="592" width="128" height="34" rx="17" fill="#ffffff" opacity=".82" stroke="#ffcf5c"/>
    <text x="448" y="615" text-anchor="middle" fill="#9a6f2a">Phaser 3</text>

    <rect x="528" y="592" width="144" height="34" rx="17" fill="#ffffff" opacity=".82" stroke="#8fd6b4"/>
    <text x="600" y="615" text-anchor="middle" fill="#4f8f74">单文件即玩</text>

    <rect x="688" y="592" width="128" height="34" rx="17" fill="#ffffff" opacity=".82" stroke="#ffcf5c"/>
    <text x="752" y="615" text-anchor="middle" fill="#9a6f2a">手机可玩</text>
  </g>
