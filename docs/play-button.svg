<svg xmlns="http://www.w3.org/2000/svg" width="420" height="96" viewBox="0 0 420 96" role="img" aria-label="进入游戏">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="20" width="388" height="56" rx="28" fill="url(#blue)" filter="url(#glow)" opacity=".85"/>
  <rect x="16" y="20" width="388" height="56" rx="28" fill="url(#blue)"/>
  <rect x="18" y="22" width="384" height="22" rx="11" fill="#ffffff" opacity=".18"/>
  <text x="210" y="56" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif"
        font-size="26" font-weight="800" fill="#ffffff" letter-spacing="2">▶ 进入游戏</text>
</svg>