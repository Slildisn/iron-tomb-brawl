name: speed-1to4

on:
  push:
    paths:
      - '.github/workflows/speed-1to4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cycle speed 1x to 4x
        run: |
          python3 - <<'PY'
          import io
          p = 'chicken/game.html'
          s = io.open(p, encoding='utf-8').read()
          pairs = [
              ("this.speedScale = this.speedScale === 1 ? 4 : 1;",
               "this.speedScale = this.speedScale >= 4 ? 1 : (this.speedScale || 1) + 1;"),
              ("this.showToast(this.speedScale === 4 ? '4 \u500d\u901f' : '\u6062\u590d 1 \u500d\u901f');",
               "this.showToast(this.speedScale === 1 ? '\u6062\u590d 1 \u500d\u901f' : this.speedScale + ' \u500d\u901f');"),
              ("// 1\u00d7 / 4\u00d7 \u500d\u901f",
               "// 1\u00d7 / 2\u00d7 / 3\u00d7 / 4\u00d7 \u500d\u901f"),
          ]
          for old, new in pairs:
              assert s.count(old) == 1, ('pattern issue', old, s.count(old))
              s = s.replace(old, new)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('patched ok')
          PY
          grep -n "speedScale" chicken/game.html

      - name: Commit and push
        run: |
          git config user.name "CYRENE Sync"
          git config user.email "sync@users.noreply.github.com"
          git rm -q .github/workflows/speed-1to4.yml
          git add chicken/game.html
          git commit -m "母鸡大战公鸡：倍速改为 1\u00d7~4\u00d7 循环"
          git push
