name: bump-speed-4x

on:
  push:
    paths:
      - '.github/workflows/bump-speed-4x.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch speed scale to 4x
        run: |
          python3 - <<'PY'
          import io
          p = 'chicken/game.html'
          s = io.open(p, encoding='utf-8').read()
          pairs = [
              ("this.speedScale = this.speedScale === 1 ? 2 : 1;",
               "this.speedScale = this.speedScale === 1 ? 4 : 1;"),
              ("this.speedScale === 2 ? '2 \u500d\u901f'",
               "this.speedScale === 4 ? '4 \u500d\u901f'"),
              ("this.speedScale = 1;        // 1\u00d7 / 2\u00d7 \u500d\u901f",
               "this.speedScale = 1;        // 1\u00d7 / 4\u00d7 \u500d\u901f"),
          ]
          for old, new in pairs:
              assert s.count(old) == 1, ('pattern not unique/missing', old, s.count(old))
              s = s.replace(old, new)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('patched ok')
          PY
          grep -n "speedScale" chicken/game.html

      - name: Commit and push
        run: |
          git config user.name "CYRENE Sync"
          git config user.email "sync@users.noreply.github.com"
          git rm -q .github/workflows/bump-speed-4x.yml
          git add chicken/game.html
          git commit -m "母鸡大战公鸡：倍速改为 4\u00d7"
          git push
