name: sync-chicken

on:
  push:
    paths:
      - '.github/workflows/sync-chicken.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest egg-war game body
        run: |
          mkdir -p chicken
          curl -fsSL https://raw.githubusercontent.com/Slildisn/slildisn.github.io/main/egg-war/game.html -o chicken/game.html
          python3 - <<'PY'
          import io
          p = 'chicken/game.html'
          s = io.open(p, encoding='utf-8').read()
          s = s.replace("'./phaser.min.js'", "'../phaser.min.js'")
          io.open(p, 'w', encoding='utf-8').write(s)
          print('bytes:', len(s.encode('utf-8')))
          PY
          grep -n 'phaser.min.js' chicken/game.html

      - name: Commit and push
        run: |
          git config user.name "CYRENE Sync"
          git config user.email "sync@users.noreply.github.com"
          git rm -q .github/workflows/sync-chicken.yml
          git add chicken/game.html
          git commit -m "母鸡大战公鸡：同步最新横屏版游戏本体到 chicken/game.html"
          git push
