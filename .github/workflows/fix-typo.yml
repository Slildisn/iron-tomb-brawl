name: fix-typo

on:
  push:
    paths:
      - '.github/workflows/fix-typo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix comment typo
        run: |
          python3 - <<'PY'
          import io
          p = 'chicken/game.html'
          s = io.open(p, encoding='utf-8').read()
          bad = '\u6574\u4f53\u653e\u5927\u654c\u65b9\u5f03\u5ea6'
          good = '\u6574\u4f53\u653e\u5927\u654c\u65b9\u5f3a\u5ea6'
          assert s.count(bad) == 1, s.count(bad)
          s = s.replace(bad, good)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('typo fixed')
          PY
          grep -n 'DIFF' chicken/game.html | head -5

      - name: Commit and push
        run: |
          git config user.name "CYRENE Sync"
          git config user.email "sync@users.noreply.github.com"
          git rm -q .github/workflows/fix-typo.yml
          git add chicken/game.html
          git commit -m "母鸡大战公鸡：修正难度注释用字"
          git push
