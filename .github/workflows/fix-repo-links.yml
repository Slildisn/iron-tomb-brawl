name: fix-repo-links

on:
  push:
    paths:
      - '.github/workflows/fix-repo-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace old repo name
        run: |
          python3 - <<'PY'
          import io, re, glob

          for p in ['README.md', 'index.html', 'chicken/index.html']:
              s = io.open(p, encoding='utf-8').read()
              before = s.count('iron-tomb-brawl')
              s = s.replace('iron-tomb-brawl', 'hen-vs-rooster')
              io.open(p, 'w', encoding='utf-8').write(s)
              print(p, 'replaced', before)

          # 修正 README 底部那句“仓库名保留历史”的表述
          r = 'README.md'
          t = io.open(r, encoding='utf-8').read()
          old = re.compile(r'<sub>仓库名保留历史.*?</sub>')
          if old.search(t):
              t = old.sub('<sub>仓库已更名为 `hen-vs-rooster`，内容只收录《母鸡大战公鸡》</sub>', t)
              io.open(r, 'w', encoding='utf-8').write(t)
              print('README footnote fixed')
          PY
          grep -rn 'iron-tomb-brawl' --include='*.html' --include='*.md' . || echo '旧名已清理完毕'

      - name: Commit and push
        run: |
          git config user.name "CYRENE Sync"
          git config user.email "sync@users.noreply.github.com"
          git rm -q .github/workflows/fix-repo-links.yml
          git add -u
          git commit -m "仓库改名后修正所有旧链接与说明"
          git push
