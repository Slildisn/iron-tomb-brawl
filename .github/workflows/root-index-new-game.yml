name: root-index-new-game

on:
  push:
    paths:
      - '.github/workflows/root-index-new-game.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build root entry page
        run: |
          python3 - <<'PY'
          import io
          src = io.open('chicken/index.html', encoding='utf-8').read()
          assert src.count('./game.html') == 3, src.count('./game.html')
          s = src.replace('./game.html', './chicken/game.html')
          assert s.count('href="../"') == 1
          s = s.replace('href="../"', 'href="./launcher.html"')
          back = '\u8fd4\u56de\u4e3b\u7ad9'
          itomb = '\u94c1\u5893\u5927\u4e71\u6597'
          assert s.count(back) == 1, s.count(back)
          s = s.replace(back, itomb)
          io.open('index.html', 'w', encoding='utf-8').write(s)
          print('root index.html bytes:', len(s.encode('utf-8')))
          PY
          grep -n 'game.html\|launcher.html' index.html | head

      - name: Commit and push
        run: |
          git config user.name "CYRENE Sync"
          git config user.email "sync@users.noreply.github.com"
          git rm -q .github/workflows/root-index-new-game.yml
          git add index.html
          git commit -m "\u6839\u76ee\u5f55\u9996\u9875\u6539\u4e3a\u65b0\u7248\u5165\u53e3\uff08\u70b9\u5165 chicken/ \u4f53\u9a8c\u6a2a\u5c4f\u7248\uff09"
          git push
