<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鸡蛋大战公鸡</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a1f10;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #game { width: 100%; height: 100%; }
  canvas { display: block; }
  #boot-msg {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    color: #a5d6a7;
    font: 16px/1.7 "Noto Sans SC", "Microsoft YaHei", sans-serif;
    pointer-events: none;
    white-space: pre-line;
  }
</style>
</head>
<body>

<div id="game"></div>
<div id="boot-msg">正在加载 Phaser 3 …</div>

<script>
'use strict';

/* ================= Phaser CDN 多源加载 ================= */
(function () {
  const CDNS = [
    'https://unpkg.com/phaser@3.80.1/dist/phaser.min.js',
    'https://lib.baomitu.com/phaser/3.80.1/phaser.min.js',
    'https://cdn.staticfile.net/phaser/3.80.1/phaser.min.js',
    'https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js'
  ];
  const msg = document.getElementById('boot-msg');
  let i = 0;

  function next() {
    if (i >= CDNS.length) {
      msg.textContent = 'Phaser 加载失败：所有 CDN 都连不上。\n请检查网络后刷新页面。';
      return;
    }
    const url = CDNS[i++];
    const s = document.createElement('script');
    s.src = url;
    s.onload = function () {
      if (window.Phaser) {
        msg.style.display = 'none';
        bootGame();
      } else {
        next();
      }
    };
    s.onerror = function () { next(); };
    document.head.appendChild(s);
  }

  next();
})();

/* ================= 游戏本体 ================= */
function bootGame() {
  const CANVAS_W = 1280;
  const CANVAS_H = 720;

  // 5 行 × 9 列草坪
  const G = { x0: 100, y0: 90, cell: 120, cols: 9, rows: 5 };
  const GRID_W = G.cols * G.cell; // 1080
  const GRID_H = G.rows * G.cell; // 600

  const FONT = '"Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif';

  const cellX = (col) => G.x0 + col * G.cell + G.cell / 2;
  const cellY = (row) => G.y0 + row * G.cell + G.cell / 2;

  // 玩家单位
  const UNIT_DEFS = {
    hen: { name: '母鸡', cost: 50, hp: 320, color: 0xff9f1c, size: 84, shape: 'rect' },
    shooter: { name: '小鸡蛋射手', cost: 100, hp: 220, color: 0xfafafa, size: 76, shape: 'circle' },
    rock: { name: '石头蛋', cost: 50, hp: 1500, color: 0x9aa0a6, size: 92, shape: 'rect' }
  };

  // 敌方
  const ENEMY = {
    hp: 260,
    color: 0xd32f2f,
    w: 66,
    h: 82,
    speed: 26,       // 像素 / 秒
    peckDmg: 30,     // 每次啄击伤害
    peckRate: 0.9    // 啄击间隔（秒）
  };

  class GameScene extends Phaser.Scene {
    constructor() {
      super('GameScene');
    }

    create() {
      this.corn = 50;
      this.over = false;
      this.selected = null;

      this.units = [];
      this.enemies = [];
      this.bullets = [];
      this.drops = [];
      this.cards = [];

      this.timers = { enemy: 4, corn: 3 };

      this.drawArena();
      this.buildCards();
      this.buildHud();
      this.bindInput();
      this.refreshHud();
    }

    /* ---------- 场地 ---------- */
    drawArena() {
      for (let r = 0; r < G.rows; r++) {
        for (let c = 0; c < G.cols; c++) {
          const color = (r + c) % 2 === 0 ? 0x2e7d32 : 0x276b2b;
          this.add.rectangle(cellX(c), cellY(r), G.cell - 4, G.cell - 4, color);
        }
      }

      const cy = G.y0 + GRID_H / 2;
      this.add.rectangle(50, cy, 96, GRID_H, 0x6d4c41).setStrokeStyle(4, 0x3e2723);
      this.add.text(50, cy - 44, '鸡窝', { fontFamily: FONT, fontSize: '26px', color: '#ffecb3' }).setOrigin(0.5);
      this.add.text(50, cy + 4, '基地', { fontFamily: FONT, fontSize: '26px', color: '#ffecb3' }).setOrigin(0.5);
      this.add.rectangle(50, cy + 76, 44, 24, 0xd7ccc8).setStrokeStyle(2, 0x8d6e63);

      this.add.rectangle(1230, cy, 96, GRID_H, 0x4e1a1a).setStrokeStyle(4, 0x2b0d0d);
      this.add.text(1230, cy - 44, '公鸡', { fontFamily: FONT, fontSize: '24px', color: '#ffcdd2' }).setOrigin(0.5);
      this.add.text(1230, cy + 4, '出兵口', { fontFamily: FONT, fontSize: '22px', color: '#ffcdd2' }).setOrigin(0.5);
      this.add.rectangle(1230, cy + 76, 44, 24, 0xffab00).setStrokeStyle(2, 0x8d6e00);
    }

    /* ---------- 卡牌 ---------- */
    buildCards() {
      const defs = [
        { key: 'hen', label: '母鸡', cost: UNIT_DEFS.hen.cost, color: UNIT_DEFS.hen.color, shape: 'rect' },
        { key: 'shooter', label: '小鸡蛋射手', cost: UNIT_DEFS.shooter.cost, color: UNIT_DEFS.shooter.color, shape: 'circle' },
        { key: 'rock', label: '石头蛋', cost: UNIT_DEFS.rock.cost, color: UNIT_DEFS.rock.color, shape: 'rect' }
      ];

      defs.forEach((d, i) => {
        const x = 12 + i * 148;
        const y = 8;
        const w = 138, h = 72;
        const bg = this.add.rectangle(x + w / 2, y + h / 2, w, h, 0x1b3b22)
          .setStrokeStyle(2, 0x000000, 0.35)
          .setInteractive({ useHandCursor: true });

        if (d.shape === 'circle') {
          this.add.circle(x + 26, y + h / 2, 16, d.color).setStrokeStyle(3, 0x9e9e9e);
        } else {
          this.add.rectangle(x + 26, y + h / 2, 32, 32, d.color).setStrokeStyle(2, 0x000000, 0.3);
        }

        this.add.text(x + 50, y + 12, d.label, { fontFamily: FONT, fontSize: '17px', color: '#e8f5e9' });
        this.add.text(x + 50, y + 42, '造价 ' + d.cost, { fontFamily: FONT, fontSize: '16px', color: '#ffe082' });

        bg.on('pointerdown', () => this.selectCard(d.key));
        this.cards.push({ key: d.key, cost: d.cost, bg });
      });
    }

    selectCard(key) {
      if (this.over) return;
      this.selected = this.selected === key ? null : key;
      this.refreshCards();
    }

    /* ---------- HUD ---------- */
    buildHud() {
      this.add.text(640, 14, '鸡蛋大战公鸡', {
        fontFamily: FONT, fontSize: '26px', color: '#a5d6a7'
      }).setOrigin(0.5, 0);

      this.cornText = this.add.text(1264, 16, '玉米粒 50', {
        fontFamily: FONT, fontSize: '30px', color: '#ffd54a'
      }).setOrigin(1, 0);

      this.add.text(640, 704, '点击卡牌选中 → 点击草坪放置 ｜ 点击掉落的玉米粒 +25', {
        fontFamily: FONT, fontSize: '17px', color: '#b0bec5'
      }).setOrigin(0.5);
    }

    refreshHud() {
      this.cornText.setText('玉米粒 ' + this.corn);
      this.refreshCards();
    }

    refreshCards() {
      this.cards.forEach((card) => {
        const afford = this.corn >= card.cost;
        const chosen = this.selected === card.key;
        card.bg.setAlpha(afford ? 1 : 0.45);
        card.bg.setStrokeStyle(chosen ? 4 : 2, chosen ? 0xfff176 : 0x000000, chosen ? 1 : 0.35);
      });
    }

    /* ---------- 输入 ---------- */
    bindInput() {
      const zone = this.add.zone(G.x0, G.y0, GRID_W, GRID_H).setOrigin(0);
      zone.setInteractive(new Phaser.Geom.Rectangle(0, 0, GRID_W, GRID_H), Phaser.Geom.Rectangle.Contains);
      zone.on('pointerdown', (pointer) => this.onGridClick(pointer));
    }

    onGridClick(pointer) {
      if (this.over || !this.selected) return;

      const col = Math.floor((pointer.x - G.x0) / G.cell);
      const row = Math.floor((pointer.y - G.y0) / G.cell);
      if (col < 0 || col >= G.cols || row < 0 || row >= G.rows) return;

      if (this.findUnit(row, col)) {
        this.flash(pointer.x, pointer.y, '这里已经有蛋了', '#ff8a80');
        return;
      }

      const def = UNIT_DEFS[this.selected];
      if (this.corn < def.cost) {
        this.flash(pointer.x, pointer.y, '玉米粒不够', '#ff8a80');
        return;
      }

      this.corn -= def.cost;
      this.spawnUnit(this.selected, row, col);
      this.selected = null;
      this.refreshHud();
    }

    findUnit(row, col) {
      return this.units.find((u) => u.row === row && u.col === col);
    }

    flash(x, y, msg, color) {
      const t = this.add.text(x, y, msg, { fontFamily: FONT, fontSize: '22px', color }).setOrigin(0.5).setDepth(50);
      this.tweens.add({ targets: t, y: y - 46, alpha: 0, duration: 800, onComplete: () => t.destroy() });
    }

    /* ---------- 生成单位 ---------- */
    spawnUnit(key, row, col) {
      const def = UNIT_DEFS[key];
      const x = cellX(col);
      const y = cellY(row);
      const parts = [];

      if (key === 'hen') {
        parts.push(this.add.rectangle(x, y, def.size, def.size, def.color).setStrokeStyle(3, 0xb26500));
        parts.push(this.add.rectangle(x, y - def.size / 2 - 10, 24, 14, 0xd84315));
        parts.push(this.add.rectangle(x - def.size / 2 - 9, y + 6, 16, 10, 0xffc107));
        parts.push(this.add.circle(x - 16, y - 16, 5, 0x3e2723));
      } else if (key === 'shooter') {
        parts.push(this.add.circle(x, y, def.size / 2, def.color).setStrokeStyle(4, 0xcfd8dc));
        parts.push(this.add.circle(x - 14, y - 10, 6, 0x37474f));
        parts.push(this.add.circle(x + 14, y - 10, 6, 0x37474f));
      } else {
        parts.push(this.add.rectangle(x, y, def.size, def.size, def.color).setStrokeStyle(4, 0x616161));
        parts.push(this.add.rectangle(x - 16, y - 14, 18, 18, 0xb0bec5));
        parts.push(this.add.rectangle(x + 16, y + 14, 12, 12, 0x78909c));
      }

      const barY = y - def.size / 2 - 20;
      const unit = {
        key, row, col, x, y,
        hp: def.hp,
        maxHp: def.hp,
        parts,
        barY,
        bar: this.makeBar(x, barY, def.size, 0x66bb6a),
        cd: key === 'hen' ? 2.5 : 0.4
      };
      this.units.push(unit);
    }

    /* ---------- 血条 ---------- */
    makeBar(x, y, w, color) {
      const bg = this.add.rectangle(x, y, w + 6, 10, 0x000000, 0.55);
      const fg = this.add.rectangle(x - w / 2, y, w, 6, color).setOrigin(0, 0.5);
      return { bg, fg, w, color };
    }

    setBar(bar, hp, maxHp, x, y) {
      const ratio = Phaser.Math.Clamp(hp / maxHp, 0, 1);
      bar.fg.displayWidth = Math.max(0.01, bar.w * ratio);
      bar.bg.setPosition(x, y);
      bar.fg.setPosition(x - bar.w / 2, y);
      bar.fg.fillColor = ratio > 0.5 ? bar.color : (ratio > 0.25 ? 0xffb300 : 0xe53935);
    }

    /* ---------- 敌人 ---------- */
    spawnEnemy() {
      const row = Phaser.Math.Between(0, G.rows - 1);
      const y = cellY(row);
      const x = 1250;

      const body = this.add.rectangle(x, y, ENEMY.w, ENEMY.h, ENEMY.color).setStrokeStyle(3, 0x7f0000);
      const comb = this.add.rectangle(x, y - ENEMY.h / 2 - 10, 26, 16, 0xb71c1c);
      const beak = this.add.rectangle(x - ENEMY.w / 2 - 9, y - 2, 18, 12, 0xffab00);
      const barY = y - ENEMY.h / 2 - 28;

      const e = {
        row, x, y,
        hp: ENEMY.hp,
        maxHp: ENEMY.hp,
        attackCd: 0,
        body,
        parts: [body, comb, beak],
        barY,
        bar: this.makeBar(x, barY, 62, 0xef5350)
      };
      this.enemies.push(e);
      this.syncEnemy(e);
    }

    syncEnemy(e) {
      e.body.x = e.x;
      e.body.y = e.y;
      e.parts[1].x = e.x;
      e.parts[2].x = e.x - ENEMY.w / 2 - 9;
      this.setBar(e.bar, e.hp, e.maxHp, e.x, e.barY);
    }

    findBlocker(e) {
      let best = null;
      for (const u of this.units) {
        if (u.row !== e.row) continue;
        const gap = e.x - u.x;
        if (gap <= 82 && gap >= -50) {
          if (!best || u.x > best.x) best = u;
        }
      }
      return best;
    }

    damageEnemy(e, dmg) {
      e.hp -= dmg;
      if (e.hp <= 0) {
        e.parts.forEach((o) => o.destroy());
        e.bar.bg.destroy();
        e.bar.fg.destroy();
        this.enemies = this.enemies.filter((x) => x !== e);
      } else {
        this.syncEnemy(e);
        this.tweens.add({ targets: e.body, scaleX: 1.12, scaleY: 0.92, duration: 70, yoyo: true });
      }
    }

    damageUnit(u, dmg) {
      u.hp -= dmg;
      if (u.hp <= 0) {
        u.parts.forEach((o) => o.destroy());
        u.bar.bg.destroy();
        u.bar.fg.destroy();
        this.units = this.units.filter((x) => x !== u);
        this.flash(u.x, u.y - 20, '碎了！', '#ffab91');
      } else {
        this.setBar(u.bar, u.hp, u.maxHp, u.x, u.barY);
        this.tweens.add({ targets: u.parts[0], alpha: 0.4, duration: 60, yoyo: true });
      }
    }

    /* ---------- 子弹 ---------- */
    fireBullet(u) {
      const x = u.x + 36;
      const g = this.add.circle(x, u.y, 9, 0xffffff).setStrokeStyle(3, 0xffb300);
      this.bullets.push({ x, y: u.y, row: u.row, speed: 430, dmg: 26, g });
    }

    nearestEnemyAhead(u) {
      let best = null;
      for (const e of this.enemies) {
        if (e.row !== u.row) continue;
        if (e.x <= u.x + 10) continue;
        if (!best || e.x < best.x) best = e;
      }
      return best;
    }

    removeBullet(b) {
      b.g.destroy();
      this.bullets = this.bullets.filter((x) => x !== b);
    }

    /* ---------- 掉落玉米粒 ---------- */
    dropCorn(x, y0, targetY, life, owner) {
      const main = this.add.circle(x, y0, 15, 0xffd54a).setStrokeStyle(3, 0xf9a825);
      const hi = this.add.circle(x - 5, y0 - 5, 4, 0xfff59d);
      main.setInteractive({ useHandCursor: true });

      const d = { x, y: y0, vy: 95, targetY, life, maxLife: life, main, hi, owner: owner || null, alive: true };

      main.on('pointerdown', (pointer, lx, ly, event) => {
        if (event && event.stopPropagation) event.stopPropagation();
        this.collectCorn(d);
      });

      this.drops.push(d);
    }

    removeDrop(d) {
      if (!d.alive) return;
      d.alive = false;
      d.main.destroy();
      d.hi.destroy();
      this.drops = this.drops.filter((x) => x !== d);
    }

    collectCorn(d) {
      if (!d.alive) return;
      this.corn += 25;
      this.refreshHud();
      this.flash(d.x, d.y - 18, '+25', '#ffd54a');
      this.removeDrop(d);
    }

    dropSkyCorn() {
      const x = Phaser.Math.Between(G.x0 + 50, G.x0 + GRID_W - 50);
      const targetY = Phaser.Math.Between(G.y0 + 50, G.y0 + GRID_H - 50);
      this.dropCorn(x, -30, targetY, 9, null);
    }

    dropHenCorn(u) {
      const owned = this.drops.filter((d) => d.owner === u).length;
      if (owned >= 3) return;
      this.dropCorn(u.x, u.y - 46, u.y - 76, 8, u);
    }

    /* ---------- 帧更新 ---------- */
    update(time, delta) {
      if (this.over) return;
      const dt = Math.min(delta, 120) / 1000;

      this.timers.enemy -= dt;
      if (this.timers.enemy <= 0) {
        this.spawnEnemy();
        this.timers.enemy = 5;
      }

      this.timers.corn -= dt;
      if (this.timers.corn <= 0) {
        this.dropSkyCorn();
        this.timers.corn = 3.5 + Math.random() * 2;
      }

      this.updateUnits(dt);
      this.updateEnemies(dt);
      this.updateBullets(dt);
      this.updateDrops(dt);
    }

    updateUnits(dt) {
      for (const u of this.units) {
        if (u.key === 'shooter') {
          u.cd -= dt;
          if (u.cd <= 0) {
            if (this.nearestEnemyAhead(u)) {
              this.fireBullet(u);
              u.cd = 1.2;
            } else {
              u.cd = 0;
            }
          }
        } else if (u.key === 'hen') {
          u.cd -= dt;
          if (u.cd <= 0) {
            this.dropHenCorn(u);
            u.cd = 5;
          }
        }
      }
    }

    updateEnemies(dt) {
      for (const e of this.enemies.slice()) {
        const blocker = this.findBlocker(e);
        if (blocker) {
          e.attackCd -= dt;
          if (e.attackCd <= 0) {
            e.attackCd = ENEMY.peckRate;
            this.damageUnit(blocker, ENEMY.peckDmg);
            this.tweens.add({
              targets: e.body, x: e.x - 8, duration: 80, yoyo: true,
              onComplete: () => { if (e.body.active) e.body.x = e.x; }
            });
          }
        } else {
          e.x -= ENEMY.speed * dt;
          this.syncEnemy(e);
          if (e.x <= G.x0 + 10) {
            this.gameOver();
            return;
          }
        }
      }
    }

    updateBullets(dt) {
      for (const b of this.bullets.slice()) {
        b.x += b.speed * dt;
        b.g.x = b.x;

        let hit = null;
        for (const e of this.enemies) {
          if (e.row !== b.row) continue;
          if (Math.abs(e.x - b.x) <= 34) { hit = e; break; }
        }

        if (hit) {
          this.damageEnemy(hit, b.dmg);
          this.removeBullet(b);
        } else if (b.x > CANVAS_W + 20) {
          this.removeBullet(b);
        }
      }
    }

    updateDrops(dt) {
      for (const d of this.drops.slice()) {
        d.life -= dt;
        if (d.y < d.targetY) d.y = Math.min(d.targetY, d.y + d.vy * dt);

        d.main.setPosition(d.x, d.y);
        d.hi.setPosition(d.x - 5, d.y - 5);

        if (d.life <= 2) {
          const a = 0.35 + 0.65 * Math.abs(Math.sin(d.life * 7));
          d.main.setAlpha(a);
          d.hi.setAlpha(a);
        }
        if (d.life <= 0) this.removeDrop(d);
      }
    }

    /* ---------- 结束 ---------- */
    gameOver() {
      if (this.over) return;
      this.over = true;
      this.selected = null;
      this.refreshCards();

      this.add.rectangle(CANVAS_W / 2, CANVAS_H / 2, CANVAS_W, CANVAS_H, 0x000000, 0.72).setDepth(100);
      this.add.text(CANVAS_W / 2, CANVAS_H / 2 - 70, '公鸡攻破了鸡窝！', {
        fontFamily: FONT, fontSize: '56px', color: '#ff8a80', fontStyle: 'bold'
      }).setOrigin(0.5).setDepth(101);
      this.add.text(CANVAS_W / 2, CANVAS_H / 2 + 10, '游戏结束 · 点击屏幕重新开始', {
        fontFamily: FONT, fontSize: '28px', color: '#eceff1'
      }).setOrigin(0.5).setDepth(101);

      this.time.delayedCall(350, () => {
        this.input.once('pointerdown', () => this.scene.restart());
      });
    }
  }

  const config = {
    type: Phaser.AUTO,
    width: CANVAS_W,
    height: CANVAS_H,
    parent: 'game',
    backgroundColor: '#0a1f10',
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    scene: [GameScene]
  };

  new Phaser.Game(config);
}
</script>

</body>
</html>
