<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>母鸡大战公鸡</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0e2420;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #game { width: 100%; height: 100%; }
  canvas { display: block; }
  #boot-msg {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    color: #9fd8c8;
    font: 16px/1.7 "Noto Sans SC", "Microsoft YaHei", sans-serif;
    pointer-events: none;
    white-space: pre-line;
  }
</style>
</head>
<body>

<div id="game"></div>
<div id="boot-msg">正在加载 Phaser 3 …</div>

<script>
'use strict';

/* ================= Phaser CDN 多源加载 ================= */
(function () {
  const CDNS = [
    'https://unpkg.com/phaser@3.80.1/dist/phaser.min.js',
    'https://lib.baomitu.com/phaser/3.80.1/phaser.min.js',
    'https://cdn.staticfile.net/phaser/3.80.1/phaser.min.js',
    'https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js'
  ];
  const msg = document.getElementById('boot-msg');
  let i = 0;

  function next() {
    if (i >= CDNS.length) {
      msg.textContent = 'Phaser 加载失败：所有 CDN 都连不上。\n请检查网络后刷新页面。';
      return;
    }
    const s = document.createElement('script');
    s.src = CDNS[i++];
    s.onload = function () {
      if (window.Phaser) {
        msg.style.display = 'none';
        bootGame();
      } else {
        next();
      }
    };
    s.onerror = function () { next(); };
    document.head.appendChild(s);
  }

  next();
})();

/* ================= 游戏本体 ================= */
function bootGame() {
  const CANVAS_W = 1280;
  const CANVAS_H = 720;

  // 5 行 × 9 列草坪
  const G = { x0: 100, y0: 90, cell: 120, cols: 9, rows: 5 };
  const GRID_W = G.cols * G.cell; // 1080
  const GRID_H = G.rows * G.cell; // 600

  const FONT = '"Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif';

  const cellX = (col) => G.x0 + col * G.cell + G.cell / 2;
  const cellY = (row) => G.y0 + row * G.cell + G.cell / 2;

  /* 玩家单位 */
  const UNIT_DEFS = {
    hen: { name: '母鸡', cost: 50, hp: 320, size: 84, color: 0xf7c948 },
    sniper: { name: '小鸡狙击手', cost: 100, hp: 220, size: 76, color: 0xffc489 },
    rock: { name: '石头蛋', cost: 50, hp: 1500, size: 92, color: 0xd7dee2 }
  };

  /* 敌方 */
  const ENEMY = {
    hp: 260,
    w: 70,
    h: 82,
    speed: 26,
    peckDmg: 30,
    peckRate: 0.9
  };

  /* ---------------- 色块绘制工具（原点居中，配合 setPosition 移动） ---------------- */
  function drawHen(g, s) {
    const half = s / 2;
    g.fillStyle(0xf7c948, 1);
    g.fillRoundedRect(-half, -half + 6, s, s - 6, 16);
    g.lineStyle(3, 0xd79b1f, 1);
    g.strokeRoundedRect(-half, -half + 6, s, s - 6, 16);

    g.fillStyle(0xffe08a, 1);
    g.fillRoundedRect(-8, 2, s * 0.52, s * 0.30, 10);

    g.fillStyle(0xe8633f, 1);
    g.fillRoundedRect(-14, -half - 10, 28, 16, 7);

    g.fillStyle(0xffa94d, 1);
    g.fillTriangle(half - 2, 4, half + 18, 12, half - 2, 20);

    g.fillStyle(0x4e342e, 1);
    g.fillCircle(-16, -12, 5.5);
  }

  function drawSniper(g, s) {
    const r = s / 2;
    g.fillStyle(0xffc489, 1);
    g.fillCircle(0, 0, r);
    g.lineStyle(3, 0xffe0bd, 1);
    g.strokeCircle(0, 0, r);

    g.fillStyle(0x8d6e63, 1);
    g.fillRoundedRect(r - 8, -5, 26, 10, 4);

    g.fillStyle(0xef8f43, 1);
    g.fillRoundedRect(-21, -r - 6, 42, 13, 7);

    g.fillStyle(0x4e342e, 1);
    g.fillCircle(-11, -4, 5.5);
  }

  function drawRock(g, s) {
    const half = s / 2;
    g.fillStyle(0xd7dee2, 1);
    g.fillRoundedRect(-half, -half, s, s, 12);
    g.lineStyle(3, 0xa9b6bf, 1);
    g.strokeRoundedRect(-half, -half, s, s, 12);

    g.fillStyle(0xeef3f5, 1);
    g.fillRoundedRect(-24, -24, 22, 16, 5);

    g.lineStyle(2, 0xb6c2ca, 1);
    g.lineBetween(-4, -10, 12, 4);
    g.lineBetween(12, 4, 4, 22);
  }

  function drawRooster(g, w, h) {
    const hw = w / 2;
    const hh = h / 2;

    g.fillStyle(0xe0553f, 1);
    g.fillRoundedRect(-hw, -hh + 6, w, h - 6, 12);
    g.lineStyle(3, 0xa8331f, 1);
    g.strokeRoundedRect(-hw, -hh + 6, w, h - 6, 12);

    g.fillStyle(0xb93a26, 1);
    g.fillTriangle(hw - 3, -8, hw + 20, -24, hw + 20, 6);

    g.fillStyle(0xb32d1c, 1);
    g.fillRoundedRect(-15, -hh - 8, 30, 15, 7);

    g.fillStyle(0xffb347, 1);
    g.fillTriangle(-hw + 2, -2, -hw - 18, 5, -hw + 2, 12);

    g.fillStyle(0xc62828, 1);
    g.fillCircle(-hw + 9, 16, 5.5);

    g.fillStyle(0xfff3e0, 1);
    g.fillCircle(-hw + 17, -16, 5.5);
    g.fillStyle(0x3e2723, 1);
    g.fillCircle(-hw + 17, -16, 2.6);
  }

  class GameScene extends Phaser.Scene {
    constructor() {
      super('GameScene');
    }

    create() {
      this.corn = 50;
      this.over = false;
      this.selected = null;

      this.units = [];
      this.enemies = [];
      this.bullets = [];
      this.drops = [];
      this.cards = [];

      this.timers = { enemy: 4, corn: 3 };

      this.drawArena();
      this.buildCards();
      this.buildHud();
      this.bindInput();
      this.refreshHud();
    }

    /* ---------------- 场地 ---------------- */
    drawArena() {
      // 底板
      this.add.rectangle(CANVAS_W / 2, CANVAS_H / 2, CANVAS_W, CANVAS_H, 0x0e2420);

      // 草坪面板
      const panel = this.add.graphics();
      panel.fillStyle(0x2a6355, 1);
      panel.fillRoundedRect(G.x0 - 8, G.y0 - 8, GRID_W + 16, GRID_H + 16, 18);

      // 格子
      for (let r = 0; r < G.rows; r++) {
        for (let c = 0; c < G.cols; c++) {
          const color = (r + c) % 2 === 0 ? 0x357a6a : 0x31705f;
          this.add.rectangle(cellX(c), cellY(r), G.cell - 6, G.cell - 6, color);
        }
      }

      // 淡网格线
      const lines = this.add.graphics();
      lines.lineStyle(1, 0xffffff, 0.06);
      for (let c = 0; c <= G.cols; c++) {
        lines.lineBetween(G.x0 + c * G.cell, G.y0, G.x0 + c * G.cell, G.y0 + GRID_H);
      }
      for (let r = 0; r <= G.rows; r++) {
        lines.lineBetween(G.x0, G.y0 + r * G.cell, G.x0 + GRID_W, G.y0 + r * G.cell);
      }

      const cy = G.y0 + GRID_H / 2;

      // 左侧：暖黄色鸡窝
      const nest = this.add.graphics();
      nest.fillStyle(0xf0c05a, 1);
      nest.fillRoundedRect(2, G.y0 + 8, 94, GRID_H - 16, 16);
      nest.lineStyle(3, 0xd9a13a, 1);
      nest.strokeRoundedRect(2, G.y0 + 8, 94, GRID_H - 16, 16);

      nest.lineStyle(3, 0xc99230, 0.55);
      for (let i = 0; i < 5; i++) {
        const y = G.y0 + 60 + i * 40;
        nest.beginPath();
        nest.moveTo(12, y);
        nest.lineTo(86, y + 12);
        nest.strokePath();
        nest.beginPath();
        nest.moveTo(86, y + 34);
        nest.lineTo(12, y + 46);
        nest.strokePath();
      }

      nest.fillStyle(0xfff6e0, 1);
      nest.fillCircle(49, cy + 78, 15);
      nest.lineStyle(2, 0xe0c79a, 1);
      nest.strokeCircle(49, cy + 78, 15);

      this.add.text(49, cy - 46, '鸡窝', { fontFamily: FONT, fontSize: '20px', color: '#5a3b12', fontStyle: 'bold' }).setOrigin(0.5);
      this.add.text(49, cy - 20, '基地', { fontFamily: FONT, fontSize: '20px', color: '#5a3b12', fontStyle: 'bold' }).setOrigin(0.5);

      // 右侧：橘红色出兵口
      const gate = this.add.graphics();
      gate.fillStyle(0xe8663c, 1);
      gate.fillRoundedRect(1184, G.y0 + 8, 94, GRID_H - 16, 16);
      gate.lineStyle(3, 0xc24a26, 1);
      gate.strokeRoundedRect(1184, G.y0 + 8, 94, GRID_H - 16, 16);

      gate.fillStyle(0xffd9c6, 0.9);
      for (let i = 0; i < 4; i++) {
        gate.fillRoundedRect(1206, G.y0 + 90 + i * 120, 50, 12, 6);
      }

      this.add.text(1231, cy - 46, '公鸡', { fontFamily: FONT, fontSize: '20px', color: '#fff3eb', fontStyle: 'bold' }).setOrigin(0.5);
      this.add.text(1231, cy - 20, '来袭', { fontFamily: FONT, fontSize: '20px', color: '#fff3eb', fontStyle: 'bold' }).setOrigin(0.5);
    }

    /* ---------------- 卡牌 ---------------- */
    buildCards() {
      const defs = [
        { key: 'hen', label: '母鸡', cost: UNIT_DEFS.hen.cost, color: 0xf7c948 },
        { key: 'sniper', label: '小鸡狙击手', cost: UNIT_DEFS.sniper.cost, color: 0xffc489 },
        { key: 'rock', label: '石头蛋', cost: UNIT_DEFS.rock.cost, color: 0xd7dee2 }
      ];

      defs.forEach((d, i) => {
        const x = 14 + i * 162;
        const y = 8;
        const w = 152;
        const h = 74;

        const g = this.add.graphics();

        this.add.text(x + 60, y + 14, d.label, {
          fontFamily: FONT, fontSize: '17px', color: '#eafaf4'
        });
        const costT = this.add.text(x + 60, y + 44, d.cost + ' 玉米粒', {
          fontFamily: FONT, fontSize: '14px', color: '#ffd54a'
        });

        const hit = this.add.rectangle(x + w / 2, y + h / 2, w, h, 0xffffff, 0.001)
          .setInteractive({ useHandCursor: true });
        hit.on('pointerdown', () => this.selectCard(d.key));

        this.cards.push({ key: d.key, cost: d.cost, color: d.color, g, costT, x, y, w, h });
      });
    }

    selectCard(key) {
      if (this.over) return;
      this.selected = this.selected === key ? null : key;
      this.redrawCards();
    }

    redrawCards() {
      this.cards.forEach((card) => {
        const chosen = this.selected === card.key;
        const afford = this.corn >= card.cost;
        const g = card.g;
        const { x, y, w, h } = card;

        g.clear();

        // 阴影
        g.fillStyle(0x000000, 0.22);
        g.fillRoundedRect(x + 2, y + 4, w, h, 16);

        // 卡面
        g.fillStyle(chosen ? 0x1d5347 : 0x14423a, afford ? 1 : 0.55);
        g.fillRoundedRect(x, y, w, h, 16);
        g.lineStyle(chosen ? 4 : 2, chosen ? 0xffd54a : 0x3c8f7d, afford ? 1 : 0.45);
        g.strokeRoundedRect(x, y, w, h, 16);

        // 图标色块
        g.fillStyle(card.color, afford ? 1 : 0.5);
        g.fillRoundedRect(x + 14, y + h / 2 - 18, 36, 36, 10);
        g.lineStyle(2, 0xffffff, 0.2);
        g.strokeRoundedRect(x + 14, y + h / 2 - 18, 36, 36, 10);

        card.costT.setAlpha(afford ? 1 : 0.45);
      });
    }

    /* ---------------- HUD ---------------- */
    buildHud() {
      this.add.text(640, 16, '母鸡大战公鸡', {
        fontFamily: FONT, fontSize: '38px', color: '#ffe9a8', fontStyle: 'bold'
      }).setOrigin(0.5, 0).setShadow(0, 3, '#00000099', 10);

      // 右上角资源
      this.add.circle(1112, 42, 13, 0xffd54a).setStrokeStyle(3, 0xe0a800);
      this.add.text(1136, 12, '玉米粒', { fontFamily: FONT, fontSize: '16px', color: '#bfe8dc' });
      this.cornText = this.add.text(1136, 32, '50', {
        fontFamily: FONT, fontSize: '28px', color: '#ffd54a', fontStyle: 'bold'
      });

      // 底部提示条
      const pillW = 780;
      const pillH = 28;
      const pill = this.add.graphics();
      pill.fillStyle(0x0b1f1b, 0.82);
      pill.fillRoundedRect(640 - pillW / 2, 690, pillW, pillH, 14);
      pill.lineStyle(2, 0x2a6355, 1);
      pill.strokeRoundedRect(640 - pillW / 2, 690, pillW, pillH, 14);

      this.add.text(640, 704, '① 点卡牌选中   ② 点草坪格子放置   ③ 点掉落的玉米粒 +25', {
        fontFamily: FONT, fontSize: '15px', color: '#9fd8c8'
      }).setOrigin(0.5);
    }

    refreshHud() {
      this.cornText.setText(String(this.corn));
      this.redrawCards();
    }

    /* ---------------- 输入 ---------------- */
    bindInput() {
      const zone = this.add.zone(G.x0, G.y0, GRID_W, GRID_H).setOrigin(0);
      zone.setInteractive(new Phaser.Geom.Rectangle(0, 0, GRID_W, GRID_H), Phaser.Geom.Rectangle.Contains);
      zone.on('pointerdown', (pointer) => this.onGridClick(pointer));
    }

    onGridClick(pointer) {
      if (this.over || !this.selected) return;

      const col = Math.floor((pointer.x - G.x0) / G.cell);
      const row = Math.floor((pointer.y - G.y0) / G.cell);
      if (col < 0 || col >= G.cols || row < 0 || row >= G.rows) return;

      if (this.findUnit(row, col)) {
        this.flash(pointer.x, pointer.y, '这里已经有蛋了', '#ffb4a2');
        return;
      }

      const def = UNIT_DEFS[this.selected];
      if (this.corn < def.cost) {
        this.flash(pointer.x, pointer.y, '玉米粒不够', '#ffb4a2');
        return;
      }

      this.corn -= def.cost;
      this.spawnUnit(this.selected, row, col);
      this.selected = null;
      this.refreshHud();
    }

    findUnit(row, col) {
      return this.units.find((u) => u.row === row && u.col === col);
    }

    flash(x, y, msg, color) {
      const t = this.add.text(x, y, msg, { fontFamily: FONT, fontSize: '22px', color })
        .setOrigin(0.5).setDepth(50);
      this.tweens.add({ targets: t, y: y - 46, alpha: 0, duration: 800, onComplete: () => t.destroy() });
    }

    /* ---------------- 玩家单位 ---------------- */
    spawnUnit(key, row, col) {
      const def = UNIT_DEFS[key];
      const x = cellX(col);
      const y = cellY(row);

      const g = this.add.graphics();
      if (key === 'hen') drawHen(g, def.size);
      else if (key === 'sniper') drawSniper(g, def.size);
      else drawRock(g, def.size);
      g.setPosition(x, y);

      const barY = y - def.size / 2 - 20;
      const unit = {
        key, row, col, x, y,
        hp: def.hp,
        maxHp: def.hp,
        body: g,
        barY,
        bar: this.makeBar(x, barY, def.size, 0x6ee7a8),
        cd: key === 'hen' ? 2.5 : 0.4
      };
      this.units.push(unit);
    }

    /* ---------------- 血条 ---------------- */
    makeBar(x, y, w, color) {
      const bg = this.add.rectangle(x, y, w + 6, 10, 0x000000, 0.45);
      const fg = this.add.rectangle(x - w / 2, y, w, 6, color).setOrigin(0, 0.5);
      return { bg, fg, w, color };
    }

    setBar(bar, hp, maxHp, x, y) {
      const ratio = Phaser.Math.Clamp(hp / maxHp, 0, 1);
      bar.fg.displayWidth = Math.max(0.01, bar.w * ratio);
      bar.bg.setPosition(x, y);
      bar.fg.setPosition(x - bar.w / 2, y);
      bar.fg.fillColor = ratio > 0.5 ? bar.color : (ratio > 0.25 ? 0xf2b33d : 0xe8553f);
    }

    /* ---------------- 敌人 ---------------- */
    spawnEnemy() {
      const row = Phaser.Math.Between(0, G.rows - 1);
      const y = cellY(row);
      const x = 1250;

      const body = this.add.graphics();
      drawRooster(body, ENEMY.w, ENEMY.h);
      body.setPosition(x, y);

      const barY = y - ENEMY.h / 2 - 30;

      const e = {
        row, x, y,
        hp: ENEMY.hp,
        maxHp: ENEMY.hp,
        attackCd: 0,
        body,
        barY,
        bar: this.makeBar(x, barY, 64, 0xff8a70)
      };
      this.enemies.push(e);
      this.syncEnemy(e);
    }

    syncEnemy(e) {
      e.body.setPosition(e.x, e.y);
      this.setBar(e.bar, e.hp, e.maxHp, e.x, e.barY);
    }

    findBlocker(e) {
      let best = null;
      for (const u of this.units) {
        if (u.row !== e.row) continue;
        const gap = e.x - u.x;
        if (gap <= 82 && gap >= -50) {
          if (!best || u.x > best.x) best = u;
        }
      }
      return best;
    }

    damageEnemy(e, dmg) {
      e.hp -= dmg;
      if (e.hp <= 0) {
        e.body.destroy();
        e.bar.bg.destroy();
        e.bar.fg.destroy();
        this.enemies = this.enemies.filter((x) => x !== e);
      } else {
        this.syncEnemy(e);
        this.tweens.add({ targets: e.body, scaleX: 1.1, scaleY: 0.92, duration: 70, yoyo: true });
      }
    }

    damageUnit(u, dmg) {
      u.hp -= dmg;
      if (u.hp <= 0) {
        u.body.destroy();
        u.bar.bg.destroy();
        u.bar.fg.destroy();
        this.units = this.units.filter((x) => x !== u);
        this.flash(u.x, u.y - 20, '碎了！', '#ffb4a2');
      } else {
        this.setBar(u.bar, u.hp, u.maxHp, u.x, u.barY);
        this.tweens.add({ targets: u.body, alpha: 0.45, duration: 60, yoyo: true });
      }
    }

    /* ---------------- 子弹 ---------------- */
    fireBullet(u) {
      const x = u.x + 36;
      const g = this.add.circle(x, u.y, 9, 0xfff3e0).setStrokeStyle(3, 0xffa94d);
      this.bullets.push({ x, y: u.y, row: u.row, speed: 430, dmg: 26, g });
    }

    nearestEnemyAhead(u) {
      let best = null;
      for (const e of this.enemies) {
        if (e.row !== u.row) continue;
        if (e.x <= u.x + 10) continue;
        if (!best || e.x < best.x) best = e;
      }
      return best;
    }

    removeBullet(b) {
      b.g.destroy();
      this.bullets = this.bullets.filter((x) => x !== b);
    }

    /* ---------------- 掉落玉米粒 ---------------- */
    dropCorn(x, y0, targetY, life, owner) {
      const main = this.add.circle(x, y0, 15, 0xffd54a).setStrokeStyle(3, 0xe0a800);
      const hi = this.add.circle(x - 5, y0 - 5, 4, 0xfff2b0);
      main.setInteractive({ useHandCursor: true });

      const d = { x, y: y0, vy: 95, targetY, life, main, hi, owner: owner || null, alive: true };

      main.on('pointerdown', (pointer, lx, ly, event) => {
        if (event && event.stopPropagation) event.stopPropagation();
        this.collectCorn(d);
      });

      this.drops.push(d);
    }

    removeDrop(d) {
      if (!d.alive) return;
      d.alive = false;
      d.main.destroy();
      d.hi.destroy();
      this.drops = this.drops.filter((x) => x !== d);
    }

    collectCorn(d) {
      if (!d.alive) return;
      this.corn += 25;
      this.refreshHud();
      this.flash(d.x, d.y - 18, '+25', '#ffd54a');
      this.removeDrop(d);
    }

    dropSkyCorn() {
      const x = Phaser.Math.Between(G.x0 + 50, G.x0 + GRID_W - 50);
      const targetY = Phaser.Math.Between(G.y0 + 50, G.y0 + GRID_H - 50);
      this.dropCorn(x, -30, targetY, 9, null);
    }

    dropHenCorn(u) {
      const owned = this.drops.filter((d) => d.owner === u).length;
      if (owned >= 3) return;
      this.dropCorn(u.x, u.y - 46, u.y - 76, 8, u);
    }

    /* ---------------- 帧更新 ---------------- */
    update(time, delta) {
      if (this.over) return;
      const dt = Math.min(delta, 120) / 1000;

      this.timers.enemy -= dt;
      if (this.timers.enemy <= 0) {
        this.spawnEnemy();
        this.timers.enemy = 5;
      }

      this.timers.corn -= dt;
      if (this.timers.corn <= 0) {
        this.dropSkyCorn();
        this.timers.corn = 3.5 + Math.random() * 2;
      }

      this.updateUnits(dt);
      this.updateEnemies(dt);
      this.updateBullets(dt);
      this.updateDrops(dt);
    }

    updateUnits(dt) {
      for (const u of this.units) {
        if (u.key === 'sniper') {
          u.cd -= dt;
          if (u.cd <= 0) {
            if (this.nearestEnemyAhead(u)) {
              this.fireBullet(u);
              u.cd = 1.2;
            } else {
              u.cd = 0;
            }
          }
        } else if (u.key === 'hen') {
          u.cd -= dt;
          if (u.cd <= 0) {
            this.dropHenCorn(u);
            u.cd = 5;
          }
        }
      }
    }

    updateEnemies(dt) {
      for (const e of this.enemies.slice()) {
        const blocker = this.findBlocker(e);
        if (blocker) {
          e.attackCd -= dt;
          if (e.attackCd <= 0) {
            e.attackCd = ENEMY.peckRate;
            this.damageUnit(blocker, ENEMY.peckDmg);
            this.tweens.add({
              targets: e.body, x: e.x - 8, duration: 80, yoyo: true,
              onComplete: () => { if (e.body.active) e.body.x = e.x; }
            });
          }
        } else {
          e.x -= ENEMY.speed * dt;
          this.syncEnemy(e);
          if (e.x <= G.x0 + 10) {
            this.gameOver();
            return;
          }
        }
      }
    }

    updateBullets(dt) {
      for (const b of this.bullets.slice()) {
        b.x += b.speed * dt;
        b.g.x = b.x;

        let hit = null;
        for (const e of this.enemies) {
          if (e.row !== b.row) continue;
          if (Math.abs(e.x - b.x) <= 34) { hit = e; break; }
        }

        if (hit) {
          this.damageEnemy(hit, b.dmg);
          this.removeBullet(b);
        } else if (b.x > CANVAS_W + 20) {
          this.removeBullet(b);
        }
      }
    }

    updateDrops(dt) {
      for (const d of this.drops.slice()) {
        d.life -= dt;
        if (d.y < d.targetY) d.y = Math.min(d.targetY, d.y + d.vy * dt);

        d.main.setPosition(d.x, d.y);
        d.hi.setPosition(d.x - 5, d.y - 5);

        if (d.life <= 2) {
          const a = 0.35 + 0.65 * Math.abs(Math.sin(d.life * 7));
          d.main.setAlpha(a);
          d.hi.setAlpha(a);
        }
        if (d.life <= 0) this.removeDrop(d);
      }
    }

    /* ---------------- 结束 ---------------- */
    gameOver() {
      if (this.over) return;
      this.over = true;
      this.selected = null;
      this.redrawCards();

      this.add.rectangle(CANVAS_W / 2, CANVAS_H / 2, CANVAS_W, CANVAS_H, 0x000000, 0.75).setDepth(100);
      this.add.text(CANVAS_W / 2, CANVAS_H / 2 - 70, '公鸡攻破了鸡窝！', {
        fontFamily: FONT, fontSize: '56px', color: '#ffb4a2', fontStyle: 'bold'
      }).setOrigin(0.5).setDepth(101);
      this.add.text(CANVAS_W / 2, CANVAS_H / 2 + 10, '游戏结束 · 点击屏幕重新开始', {
        fontFamily: FONT, fontSize: '28px', color: '#e8f5ef'
      }).setOrigin(0.5).setDepth(101);

      this.time.delayedCall(350, () => {
        this.input.once('pointerdown', () => this.scene.restart());
      });
    }
  }

  const config = {
    type: Phaser.AUTO,
    width: CANVAS_W,
    height: CANVAS_H,
    parent: 'game',
    backgroundColor: '#0e2420',
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    scene: [GameScene]
  };

  new Phaser.Game(config);
}
</script>
